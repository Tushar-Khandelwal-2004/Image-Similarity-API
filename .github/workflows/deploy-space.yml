name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_SPACE_ID: beluga-69/securepixel-ai-service
  DEPLOYMENT_URL: https://beluga-69-securepixel-ai-service.hf.space

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy current main commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pnpm deploy:space
      - name: Verify deployed Space
        env:
          DEPLOYMENT_TIMEOUT_MS: 900000
        run: pnpm exec tsx scripts/smoke-deployment.ts
